version: 2.1

jobs:
  windows-runner:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass

    steps:
      - checkout

      - run:
          name: Install Tailscale AMD64
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"

            $installer = "$env:TEMP\tailscale-setup-amd64.exe"
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.1.exe"

            Invoke-WebRequest -Uri $url -OutFile $installer

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/quiet" `
              -Wait `
              -PassThru

            if ($process.ExitCode -ne 0) {
              throw "Tailscale installation failed: $($process.ExitCode)"
            }

            $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

            if (!(Test-Path $tailscale)) {
              throw "Tailscale executable not found."
            }

            Write-Host "Tailscale installed successfully."

      - run:
          name: Configure Administrator and RDP
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"

            # Find the built-in Administrator account.
            $admin = Get-LocalUser |
              Where-Object { $_.SID.Value -match '-500$' }

            if (-not $admin) {
              throw "Built-in Administrator account not found."
            }

            if (-not $admin.Enabled) {
              Enable-LocalUser -Name $admin.Name
            }

            # Read the password from CircleCI project environment variables.
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PASSWORD)) {
              throw "Configure WINDOWS_PASSWORD in CircleCI project settings."
            }

            $password = ConvertTo-SecureString `
              $env:WINDOWS_PASSWORD `
              -AsPlainText `
              -Force

            Set-LocalUser -Name $admin.Name -Password "3A|R&e_|8h4'T\3R?O6-`C+n/25*5036=?pHz~+utBV,(CQfB?"

            Write-Host "Administrator account configured."

            # Enable Remote Desktop.
            $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"

            Set-ItemProperty `
              -Path $rdpPath `
              -Name fDenyTSConnections `
              -Value 0

            # Enable the built-in RDP firewall rules.
            $rules = Get-NetFirewallRule `
              -DisplayGroup "Remote Desktop" `
              -ErrorAction SilentlyContinue

            if ($rules) {
              $rules | Enable-NetFirewallRule
            }

            $settings = Get-ItemProperty -Path $rdpPath

            if ($settings.fDenyTSConnections -ne 0) {
              throw "Failed to enable Remote Desktop."
            }

            Write-Host "Remote Desktop is enabled."

      - run:
          name: Tailscale Browser Authentication
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"

            $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

            Write-Host "Starting Tailscale authentication."
            Write-Host "Open the login URL in the job logs if one appears."

            & $tailscale up

            if ($LASTEXITCODE -ne 0) {
              throw "Tailscale authentication failed."
            }

            Write-Host "Tailscale status:"
            & $tailscale status

            Write-Host "Tailscale IPv4 address:"
            & $tailscale ip -4

      - run:
          name: Check RDP Before Sleeping
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"

            $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
            $tcpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

            $settings = Get-ItemProperty -Path $rdpPath
            $tcpSettings = Get-ItemProperty -Path $tcpPath

            if ($settings.fDenyTSConnections -ne 0) {
              throw "RDP is disabled. Refusing to sleep."
            }

            $port = $tcpSettings.PortNumber

            Write-Host "RDP enabled."
            Write-Host "RDP port: $port"

            $listener = Get-NetTCPConnection `
              -State Listen `
              -LocalPort $port `
              -ErrorAction SilentlyContinue

            if (-not $listener) {
              throw "No RDP listener detected. Refusing to sleep."
            }

            Write-Host "RDP listener detected."
            Write-Host "Tailscale status:"
            & "$env:ProgramFiles\Tailscale\tailscale.exe" status

            # Sleep in five-minute intervals.
            while ($true) {
              Start-Sleep -Seconds 300
              Write-Host "Still running: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            }

workflows:
  windows-workflow:
    jobs:
      - windows-runner
