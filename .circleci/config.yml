version: 2.1

jobs:
  windows-runner:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass

    steps:
      - checkout

      - run:
          name: Reboot
          shell: powershell.exe
          command: |
            # Sleep in five-minute intervals.
            while ($true) {
              Start-Sleep -Seconds 300
              Write-Host "Rerun this with ssh remember to add ssh key"
            }

workflows:
  windows-workflow:
    jobs:
      - windows-runner
