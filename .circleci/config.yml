version: 2.1

jobs:
  windows-runner:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass

    steps:
      - checkout

      - run:
          name: Install Tailscale AMD64
          shell: powershell.exe
          command: |
            # Sleep in five-minute intervals.
            while ($true) {
              Start-Sleep -Seconds 300
              Write-Host "Still running: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            }

workflows:
  windows-workflow:
    jobs:
      - windows-runner
