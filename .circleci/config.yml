version: 2.1

jobs:
  sshx:
    machine: true
    resource_class: large
    steps:
      - run:
          name: Show runner resources
          command: |
            echo "=== CPU ==="
            nproc
            echo "=== RAM ==="
            free -h
            echo "=== Disk ==="
            df -h /

      - run:
          name: Install and launch sshx
          command: |
            curl -sSf https://sshx.io/get | sh -s run

workflows:
  launch:
    jobs:
      - sshx
